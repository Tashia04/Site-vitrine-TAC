<header class="site-header" [class.scrolled]="isScrolled">
  <div class="container header-container">
    <!-- Logo TAC -->
    <a routerLink="/accueil" (click)="closeMobileMenu()" class="logo-link" aria-label="Accueil Touré Accessories Company">
      <img src="assets/images/logo/tac-logo.png" alt="Touré Accessories Company" class="logo-img" />
      <div class="logo-text">
        <span class="brand-title">TOURÉ</span>
        <span class="brand-sub">ACCESSORIES COMPANY</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav" aria-label="Navigation principale">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/accueil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
            Accueil
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/a-propos" routerLinkActive="active" class="nav-link">
            À propos
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/produits" routerLinkActive="active" class="nav-link">
            Mes produits
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/contact" routerLinkActive="active" class="nav-link">
            Contact
          </a>
        </li>
      </ul>
    </nav>

    <!-- Header Action Button (Desktop) -->
    <div class="header-actions">
      <a routerLink="/contact" class="btn btn-outline-gold header-cta">
        <span>Nous contacter</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
      </a>

      <!-- Hamburger Button (Mobile) -->
      <button 
        type="button" 
        class="hamburger-btn" 
        [class.active]="isMobileMenuOpen" 
        (click)="toggleMobileMenu()" 
        aria-label="Ouvrir le menu de navigation"
        [attr.aria-expanded]="isMobileMenuOpen">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-menu-backdrop" [class.open]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
  <nav class="mobile-menu" [class.open]="isMobileMenuOpen" aria-label="Menu mobile">
    <div class="mobile-menu-header">
      <div class="mobile-logo">
        <img src="assets/images/logo/tac-logo.png" alt="TAC" class="mobile-logo-img" />
        <span class="mobile-logo-text">TOURÉ ACCESSORIES</span>
      </div>
      <button type="button" class="close-btn" (click)="closeMobileMenu()" aria-label="Fermer le menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>

    <ul class="mobile-nav-list">
      <li class="mobile-nav-item">
        <a routerLink="/accueil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()" class="mobile-nav-link">
          <span class="link-label">Accueil</span>
          <span class="link-bullet"></span>
        </a>
      </li>
      <li class="mobile-nav-item">
        <a routerLink="/a-propos" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-link">
          <span class="link-label">À propos</span>
          <span class="link-bullet"></span>
        </a>
      </li>
      <li class="mobile-nav-item">
        <a routerLink="/produits" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-link">
          <span class="link-label">Mes produits</span>
          <span class="link-bullet"></span>
        </a>
      </li>
      <li class="mobile-nav-item">
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()" class="mobile-nav-link">
          <span class="link-label">Contact</span>
          <span class="link-bullet"></span>
        </a>
      </li>
    </ul>

    <div class="mobile-menu-footer">
      <a routerLink="/produits" (click)="closeMobileMenu()" class="btn btn-primary w-full">
        Découvrir nos produits
      </a>
      <p class="mobile-contact-hint">Dakar, Sénégal &bull; +221 77 503 83 97</p>
    </div>
  </nav>
</header>
